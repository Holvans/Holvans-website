name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 或者您的默认分支名称，如 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.1.4
        with:
          branch: gh-pages  # 部署到的分支
          folder: .         # 要部署的文件夹，这里是根目录 